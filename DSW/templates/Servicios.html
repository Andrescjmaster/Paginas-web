<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSW - Nuestros Servicios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/Navegador.css">
  <link rel="stylesheet" href="../static/css/Servicios.css">
</head>
<body>

  <!-- NAVEGADOR UNIVERSAL -->
  <div id="navegador-container"></div>

  <!-- CAROUSEL NUESTROS SERVICIOS - animación Bootstrap -->
  <div id="serviciosCarousel" class="carousel slide carousel-fade servicios-carousel" data-bs-ride="carousel" data-bs-interval="4000" data-bs-pause="false">

    <!-- Indicadores amarillos -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="0" class="active" aria-current="true"></button>
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="3"></button>
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="4"></button>
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="5"></button>
      <button type="button" data-bs-target="#serviciosCarousel" data-bs-slide-to="6"></button>
    </div>

    <div class="carousel-inner">
      <!-- Slide 1: NUESTROS SERVICIOS -->
      <div class="carousel-item active">
        <div class="serv-bg bg-nuestros"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">NUESTROS<br>SERVICIOS</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>

      <!-- Slide 2: IMPORTACIÓN -->
      <div class="carousel-item">
        <div class="serv-bg bg-importacion"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">IMPORTACIÓN</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>

      <!-- Slide 3: EXPORTACIÓN -->
      <div class="carousel-item">
        <div class="serv-bg bg-exportacion"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">EXPORTACIÓN</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>

      <!-- Slide 4: ADUANA -->
      <div class="carousel-item">
        <div class="serv-bg bg-aduana"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">AGENCIA<br>DE ADUANA</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>

      <!-- Slide 5: TRANSPORTE -->
      <div class="carousel-item">
        <div class="serv-bg bg-transporte"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">TRANSPORTE<br>INTERNACIONAL</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>

      <!-- Slide 6: LOGÍSTICA -->
      <div class="carousel-item">
        <div class="serv-bg bg-logistica"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">LOGÍSTICA<br>INTEGRAL</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>

      <!-- Slide 7: ASESORÍA -->
      <div class="carousel-item">
        <div class="serv-bg bg-asesoria"></div>
        <div class="serv-overlay"></div>
        <div class="serv-content">
          <h2 class="serv-title">ASESORÍA<br>LEGAL</h2>
          <a href="#" class="btn-cotiza">COTIZA</a>
        </div>
      </div>
    </div>

    <!-- Flechas amarillas -->
    <button class="carousel-control-prev" type="button" data-bs-target="#serviciosCarousel" data-bs-slide="prev">
      <span class="arrow-y" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#serviciosCarousel" data-bs-slide="next">
      <span class="arrow-y" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/navegador.js"></script>
</body>
</html>
