<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSW - Tu Socio Estratégico en Logística Global</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- CSS propio por template -->
  <link rel="stylesheet" href="../static/css/Navegador.css">
  <link rel="stylesheet" href="../static/css/Home.css">
</head>
<body>

  <!-- NAVEGADOR UNIVERSAL - se inyecta desde Navegador.html vía ../static/js/navegador.js -->
  <div id="navegador-container"></div>

  <!-- HOME - HERO -->
  <section class="hero-home">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>TU SOCIO ESTRATÉGICO<br>EN LOGÍSTICA GLOBAL</h1>
      <p class="sub">Eficiencia y cumplimiento en Aduanas</p>
      <a href="#" class="btn-home">DESCUBRE NUESTROS<br>SERVICIOS</a>
    </div>
  </section>

  <!-- MISIÓN / VISIÓN - imágenes alojadas en Home.css, no en este HTML -->
  <section class="mv-section">
    <div class="mv-row mision">
      <div class="mv-img mv-img-mision" role="img" aria-label="Misión DSW"></div>
      <h2 class="mv-title">MISIÓN</h2>
      <div class="mv-card">
        <p>Agregar algo de texto</p>
        <a href="#" class="btn-mv">DESCUBRE NUESTROS<br>SERVICIOS</a>
      </div>
    </div>
    <div class="mv-row vision">
      <h2 class="mv-title">VISIÓN</h2>
      <div class="mv-img mv-img-vision" role="img" aria-label="Visión DSW"></div>
      <div class="mv-card">
        <p>Agregar algo de texto</p>
        <a href="#" class="btn-mv">DESCUBRE NUESTROS<br>SERVICIOS</a>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/navegador.js"></script>
</body>
</html>
